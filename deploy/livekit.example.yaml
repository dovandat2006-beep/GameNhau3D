# Replace the key/secret in BOTH this file and .env. Never commit real secrets.
port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
keys:
  devkey: replace-with-long-random-secret
room:
  auto_create: true
  max_participants: 6
  empty_timeout: 60
  departure_timeout: 20
webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:3001/api/livekit/webhook
turn:
  enabled: true
  domain: voice.example.com
  udp_port: 3478
  # For networks that block UDP, supply CA-signed certificates and enable TLS.
  # tls_port: 5349
  # cert_file: /certs/fullchain.pem
  # key_file: /certs/privkey.pem
logging:
  level: info
